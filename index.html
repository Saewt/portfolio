<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emir Ekici</title>
    <meta
      name="description"
      content="Emir Ekici — kişisel portfolyo. Yapım aşamasında."
    />

    <!-- Google Fonts — ana site ile aynı -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Source+Sans+3:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* —— Renk paleti: ana site ile uyumlu —— */
      :root {
        --bg-deep: #0a0514;
        --bg-mid: #150a24;
        --petal-1: #d4a5c7;
        --petal-2: #e8b4cb;
        --petal-3: #c9b1d4;
        --core-text: #f0e6f5;
        --text-sub: #8a7a96;
        --font-display: "Cormorant Garamond", Georgia, serif;
        --font-body: "Source Sans 3", -apple-system, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background:
          radial-gradient(
            ellipse at 50% 60%,
            rgba(74, 37, 75, 0.25) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at center,
            var(--bg-mid) 0%,
            var(--bg-deep) 70%
          );
        color: var(--core-text);
        font-family: var(--font-body);
        overflow: hidden;
        position: relative;
      }

      /* —— Atmosferik arka plan lekeleri —— */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 20% 30%,
            rgba(232, 180, 203, 0.04),
            transparent 25%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(201, 177, 212, 0.035),
            transparent 28%
          );
      }

      /* —— Merkez ışık halesi —— */
      .glow {
        position: absolute;
        width: clamp(280px, 50vw, 500px);
        height: clamp(280px, 50vw, 500px);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(212, 165, 199, 0.12) 0%,
          rgba(201, 177, 212, 0.06) 35%,
          transparent 65%
        );
        animation: glow-pulse 6s ease-in-out infinite;
      }

      @keyframes glow-pulse {
        0%,
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.08);
        }
      }

      /* —— İçerik —— */
      .container {
        text-align: center;
        z-index: 2;
        padding: 0 24px;
      }

      .mystic-time {
        font-family: var(--font-display);
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        font-weight: 300;
        letter-spacing: 0.15em;
        color: var(--petal-1);
        margin-bottom: 20px;
        opacity: 0.8;
        text-shadow:
          0 0 15px rgba(212, 165, 199, 0.4),
          0 0 35px rgba(212, 165, 199, 0.15);
        animation: time-fade-in 2s ease-out both;
      }

      h1 {
        font-family: var(--font-display);
        font-size: clamp(2.2rem, 6vw, 3.5rem);
        font-weight: 300;
        letter-spacing: 0.06em;
        margin: 0 0 14px 0;
        color: var(--core-text);
        text-shadow: 0 0 30px rgba(240, 230, 245, 0.15);
        animation: name-fade-in 2s ease-out 0.4s both;
      }

      .subtitle {
        font-family: var(--font-body);
        font-size: clamp(0.75rem, 2vw, 0.9rem);
        font-weight: 300;
        color: var(--text-sub);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        animation: sub-fade-in 2s ease-out 0.8s both;
      }

      /* —— Giriş animasyonları —— */
      @keyframes time-fade-in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 0.8;
          transform: translateY(0);
        }
      }
      @keyframes name-fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes sub-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* —— Reduced motion —— */
      @media (prefers-reduced-motion: reduce) {
        .glow {
          animation: none;
          opacity: 0.8;
        }
        .mystic-time,
        h1,
        .subtitle {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="container">
      <h1>Emir Ekici</h1>
      <p class="subtitle">Under Development</p>
    </div>
  </body>
</html>
